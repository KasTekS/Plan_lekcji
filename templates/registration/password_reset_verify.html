
<!-- templates/registration/password_reset_verify.html -->
{% extends 'base.html' %}

{% block title %}Ustaw Nowe Hasło{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="width: 100%; max-width: 500px; padding: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 64px; margin-bottom: 1rem;">🔐</div>
            <h2 class="page-title">Ustaw Nowe Hasło</h2>
        </div>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" style="margin-bottom: 1rem;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="code" style="font-weight: bold; color: var(--awans-navy);">
                    Kod Weryfikacyjny (z emaila):
                </label>
                <input 
                    type="text" 
                    name="code" 
                    id="code" 
                    class="form-control" 
                    maxlength="6" 
                    pattern="[0-9]{6}"
                    placeholder="000000"
                    required 
                    autofocus
                    style="text-align: center; font-size: 20px; letter-spacing: 8px;">
            </div>

            <div class="form-group">
                <label for="new_password" style="font-weight: bold; color: var(--awans-navy);">
                    Nowe Hasło:
                </label>
                <input 
                    type="password" 
                    name="new_password" 
                    id="new_password" 
                    class="form-control" 
                    minlength="8"
                    required>
                <small style="color: #666; display: block; margin-top: 0.3rem;">
                    Minimum 8 znaków
                </small>
            </div>

            <div class="form-group">
                <label for="new_password_confirm" style="font-weight: bold; color: var(--awans-navy);">
                    Powtórz Nowe Hasło:
                </label>
                <input 
                    type="password" 
                    name="new_password_confirm" 
                    id="new_password_confirm" 
                    class="form-control" 
                    minlength="8"
                    required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; padding: 0.8rem;">
                <i class="fas fa-check-circle"></i> Ustaw Nowe Hasło
            </button>
        </form>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{% url 'login' %}" style="color: var(--awans-navy);">
                <i class="fas fa-arrow-left"></i> Powrót do logowania
            </a>
        </div>
    </div>
</div>

<script>
// Walidacja zgodności haseł
document.querySelector('form').addEventListener('submit', function(e) {
    const pass1 = document.getElementById('new_password').value;
    const pass2 = document.getElementById('new_password_confirm').value;
    
    if (pass1 !== pass2) {
        e.preventDefault();
        alert('Hasła nie są identyczne!');
        return false;
    }
});
</script>
{% endblock %}
