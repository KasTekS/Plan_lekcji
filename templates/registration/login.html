{% extends 'base.html' %}

{% block title %}Logowanie - Panel AWANS{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
        <h2 class="page-title" style="text-align: center; margin-bottom: 1.5rem;">Zaloguj się</h2>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="alert alert-error" style="margin-bottom: 1rem;">
                    Błędna nazwa użytkownika lub hasło.
                </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username" style="font-weight: bold; color: var(--awans-navy);">Login:</label>
                <input type="text" name="username" class="form-control" id="id_username" required autofocus>
            </div>

            <div class="form-group">
                <label for="id_password" style="font-weight: bold; color: var(--awans-navy);">Hasło:</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
                <i class="fas fa-sign-in-alt"></i> Zaloguj
            </button>
            
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
