{% extends 'base.html' %}

{% block title %}Nauczyciele - Panel AWANS{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Baza Nauczycieli</h1>
    <a href="{% url 'dodaj_nauczyciela' %}" class="btn btn-gold">
        <i class="fas fa-plus"></i> Dodaj Nauczyciela
    </a>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Imię i Nazwisko</th>
                <th style="text-align: right; width: 150px;">Akcje</th>
            </tr>
        </thead>
        <tbody>
            {% for n in nauczyciele %}
            <tr>
                <td><strong>{{ n.imie_nazwisko }}</strong></td>
                <td style="text-align: right;">
                    <a href="{% url 'edytuj_nauczyciela' n.id %}" class="action-btn" title="Edytuj">
                        <i class="fas fa-edit"></i>
                    </a>
                    <form action="{% url 'usun_nauczyciela' n.id %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="action-btn delete" onclick="return confirm('Czy na pewno usunąć nauczyciela {{ n.imie_nazwisko }}?')" title="Usuń">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
